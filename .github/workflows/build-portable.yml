name: Build Portable Zed (Windows x64)

on:
  workflow_dispatch: {}

env:
  ZED_WORKSPACE: ${{ github.workspace }}
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Free up disk space (Linux only)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main

      - name: Free up disk space Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Output "Cleaning Windows temp folders and common caches..."
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:TMP\*" -Recurse -Force -ErrorAction SilentlyContinue

          # Remove NuGet global packages cache (optional)
          $nugetCache = Join-Path $env:USERPROFILE ".nuget\packages"
          if (Test-Path $nugetCache) {
            Write-Output "Clearing NuGet packages cache..."
            Get-ChildItem $nugetCache -Recurse -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

          # Do not call non-portable Chocolatey commands; only detect presence
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            Write-Output "Chocolatey is installed; skipping Chocolatey-specific cleanup to avoid unsupported commands."
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-stable
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Configure release env
        id: configure_release
        shell: pwsh
        run: |
          # Channel fixed to stable
          $channel = 'stable'
          # Determine version from crates/zed/Cargo.toml if present
          $version = "0.0.0-dev"
          if (Test-Path crates/zed/Cargo.toml) {
            $toml = Get-Content crates/zed/Cargo.toml -Raw
            if ($toml -match 'version\s*=\s*"(.*?)"') { $version = $matches[1] }
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZED_RELEASE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "RELEASE_VERSION=$version"
          Write-Output "RELEASE_CHANNEL=$channel"

      - name: Build Zed, CLI and updater
        shell: pwsh
        run: |
          cargo build --release --package zed --package cli --package auto_update_helper --target x86_64-pc-windows-msvc

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $rel = "target/x86_64-pc-windows-msvc/release"
          $channel = $env:RELEASE_CHANNEL
          $version = $env:RELEASE_VERSION
          $app = "ZedPortable"

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $app
          New-Item -ItemType Directory -Force -Path "$app/bin", "$app/tools", "$app/x64" | Out-Null

          if (-not (Test-Path "$rel/zed.exe")) { Write-Error "zed.exe not found at $rel"; exit 1 }
          if (-not (Test-Path "$rel/cli.exe")) { Write-Error "cli.exe not found at $rel"; exit 1 }
          if (-not (Test-Path "$rel/auto_update_helper.exe")) { Write-Error "auto_update_helper.exe not found at $rel"; exit 1 }

          Copy-Item "$rel/zed.exe" "$app/Zed.exe"
          Copy-Item "$rel/cli.exe" "$app/bin/zed.exe"
          Copy-Item "$rel/auto_update_helper.exe" "$app/tools/auto_update_helper.exe"

          Write-Output "Downloading ConPTY terminal support..."
          $conptyUrl = "https://github.com/microsoft/terminal/releases/download/v1.23.13503.0/Microsoft.Windows.Console.ConPTY.1.23.251216003.nupkg"
          $out = "conpty.nupkg"
          Invoke-WebRequest -Uri $conptyUrl -OutFile $out

          if (Test-Path ".github/conpty.sha256") {
            $expected = (Get-Content ".github/conpty.sha256" -Raw).Trim()
            $actual = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
            $expectedNormalized = $expected -replace '\s+','' -replace '^[A-Fa-f0-9]+:','' -replace 'sha256:',''
            $expectedNormalized = $expectedNormalized.ToLower()
            if ($actual -ne $expectedNormalized) {
              Write-Error "ConPTY checksum mismatch. Expected: $expectedNormalized Actual: $actual"
              exit 1
            } else {
              Write-Output "ConPTY checksum verified."
            }
          } else {
            Write-Output "No checksum file found at .github/conpty.sha256; skipping checksum verification."
          }

          Copy-Item $out conpty.zip -Force
          Expand-Archive conpty.zip -DestinationPath conpty -Force

          if (-not (Test-Path "conpty/build/native/runtimes/x64/OpenConsole.exe")) { Write-Error "OpenConsole.exe not found in package"; exit 1 }
          if (-not (Test-Path "conpty/runtimes/win-x64/native/conpty.dll")) { Write-Error "conpty.dll not found in package"; exit 1 }

          Copy-Item "conpty/build/native/runtimes/x64/OpenConsole.exe" "$app/x64/OpenConsole.exe"
          Copy-Item "conpty/runtimes/win-x64/native/conpty.dll" "$app/conpty.dll"

      - name: Zip portable folder
        shell: pwsh
        run: |
          $channel = $env:RELEASE_CHANNEL
          $version = $env:RELEASE_VERSION
          $workspace = $env:ZED_WORKSPACE
          $zipName = "ZedPortable-windows-x64-$channel-$version.zip"
          Compress-Archive -Path "ZedPortable" -DestinationPath "$workspace\\$zipName" -Force
          Write-Output "Created: $zipName"
          Get-Item "$workspace\\$zipName" | Select-Object Name, Length
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_PATH=$workspace\\$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZedPortable-Windows-x64-stable
          path: ${{ env.ZIP_PATH }}
          retention-days: 7
